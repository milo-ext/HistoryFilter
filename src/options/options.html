<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HistoryFilter</title>
  <link rel="stylesheet" href="options.css">
  <link rel="icon" href="../../assets/icons/icon32.png">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img class="mark" src="../../assets/icons/icon128.png" alt="" width="34" height="34"><strong>HistoryFilter</strong></div>
    <nav class="nav" aria-label="Sections" data-i18n-aria-label="navLabel">
      <button class="active" type="button" data-page="rules" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span data-i18n="navRules"></span></button>
      <button type="button" data-page="cleanup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 7V5h10v2m-11 0 1 13h10l1-13M10 11v6m4-6v6"/></svg><span data-i18n="navCleanup"></span></button>
      <button type="button" data-page="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6v14h16M7 15l4-4 3 2 4-5"/></svg><span data-i18n="navActivity"></span></button>
    </nav>
    <div class="side-note"><strong data-i18n="localTitle"></strong><br><span data-i18n="localNote"></span></div>
  </aside>
  <div class="main">
    <header class="topbar"><span class="crumb" id="crumb"></span><span class="top-actions"><a href="help.html" target="_blank" rel="noopener" data-i18n="helpLink"></a><button class="lang-button" type="button" id="language-toggle"></button></span></header>
    <main class="content" id="main">
      <section class="page active" id="page-rules" aria-labelledby="rules-title">
        <div class="heading"><div><h1 id="rules-title" tabindex="-1" data-i18n="navRules"></h1><p data-i18n="rulesIntro"></p></div><div class="heading-actions"><button class="btn" type="button" id="open-templates-btn" data-i18n="addFromTemplate"></button><button class="btn primary" type="button" id="add-rule-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addRule"></span></button></div></div>
        <div class="hintbar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg><div><strong data-i18n="firstMatchTitle"></strong> <span data-i18n="firstMatchBody"></span></div></div>
        <div class="details-note" id="default-preset-note" hidden style="margin-bottom:20px"><strong data-i18n="presetTitle"></strong> <span data-i18n="presetBody"></span></div>
        <div class="section"><div class="section-head"><div><h2><span data-i18n="myRules"></span> <span id="rule-count"></span></h2><p data-i18n="reorderHint"></p></div><div class="section-actions"><button class="btn" type="button" id="import-rules-btn" data-i18n="importRules"></button><button class="btn" type="button" id="export-rules-btn" data-i18n="exportRules"></button><input type="file" id="import-file" accept=".json,application/json" hidden></div></div><div class="rule-list" id="rules-list"></div></div><p id="rule-status" role="status" aria-live="polite"></p>
        <div class="grid-2"><div class="section mini-section"><h2 data-i18n="matchingTitle"></h2><p data-i18n="matchingBody"></p></div><div class="section mini-section"><h2 data-i18n="testTitle"></h2><p data-i18n="testBody"></p><div class="inline-test"><input class="input" id="test-url" type="url" spellcheck="false" data-i18n-aria-label="testUrlLabel" placeholder="https://example.com/?q=test"><button class="btn" type="button" id="test-rule-btn" data-i18n="testButton"></button></div><div class="match-result" id="test-result" role="status" aria-live="polite"></div></div></div>
        <p class="footer-note" data-i18n="automaticNote"></p>
      </section>
      <section class="page" id="page-cleanup" aria-labelledby="cleanup-title">
        <div class="heading"><div><h1 id="cleanup-title" tabindex="-1" data-i18n="navCleanup"></h1><p data-i18n="cleanupIntro"></p></div></div>
        <div class="section mini-section"><h2 data-i18n="scanScope"></h2><fieldset class="range-options" id="cleanup-range"><legend data-i18n="rangeLegend"></legend><div class="range-choice" id="days-input-container"><input type="radio" name="cleanup-range" id="cleanup-recent" value="recent" checked data-i18n-aria-label="recentRangeLabel"><label for="cleanup-recent" data-i18n="recentPrefix"></label><input class="input" id="cleanup-days" type="number" min="1" max="3650" step="1" value="30" data-i18n-aria-label="daysInputLabel"><label for="cleanup-days" data-i18n="daysSuffix"></label></div><div class="range-choice"><input type="radio" name="cleanup-range" id="cleanup-all-time" value="all"><label for="cleanup-all-time" data-i18n="allHistory"></label></div></fieldset><div class="preview-action-row"><button class="btn primary" type="button" id="cleanup-btn" data-i18n="previewImpact"></button></div><p class="scope-note" data-i18n="scopeNote"></p>
          <p id="cleanup-status" role="status" aria-live="polite"></p>
          <div class="preview" id="preview-container" hidden><div class="section-head" style="padding:0 0 16px"><div><h2 id="preview-title"></h2><p id="preview-subtitle"></p></div></div><div id="preview-stats"></div><div class="preview-footer" id="preview-actions"><button class="btn" type="button" id="cancel-cleanup-btn" data-i18n="cancel"></button><button class="btn danger" type="button" id="confirm-cleanup-btn" data-i18n="confirmCleanup"></button></div></div>
        </div><p class="footer-note" data-i18n="cleanupFooter"></p>
      </section>
      <section class="page" id="page-activity" aria-labelledby="activity-title">
        <div class="heading"><div><h1 id="activity-title" tabindex="-1" data-i18n="navActivity"></h1><p data-i18n="activityIntro"></p></div><button class="btn" type="button" id="clear-logs-btn" data-i18n="clearLogs"></button></div><div class="section" id="logs-list"></div><p class="footer-note" data-i18n="activityFooter"></p>
      </section>
      <footer class="footer-note"><a href="https://milo-ext.github.io/HistoryFilter/privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="privacyLink"></a></footer>
    </main>
  </div>
</div>
<div class="modal-back" id="rule-modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><div><h2 id="modal-title"></h2><p data-i18n="editorIntro"></p></div><button class="btn icon" type="button" id="close-rule-btn" data-i18n-aria-label="closeDialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
  <form id="rule-form" novalidate><div class="modal-body"><input type="hidden" id="rule-id"><p class="details-note" id="site-template-note" hidden data-i18n="siteTemplateNote"></p><div class="field"><label for="rule-name" data-i18n="ruleName"></label><input class="input" id="rule-name" maxlength="100" required data-i18n-placeholder="ruleNamePlaceholder"></div><div class="field"><label for="rule-action" data-i18n="action"></label><select id="rule-action"><option value="normalize" data-i18n="normalizeAction"></option><option value="block" data-i18n="blockAction"></option></select><small id="action-help"></small></div><div class="field"><label for="rule-match-type" data-i18n="matchType"></label><select id="rule-match-type"><option value="domain" data-i18n="domainRecommended"></option><option value="query" data-i18n="queryMatchType"></option><option value="regex" data-i18n="regexAdvanced"></option></select></div><div class="field"><label for="rule-pattern" id="pattern-label"></label><input class="input" id="rule-pattern" required spellcheck="false" autocomplete="off"><small id="pattern-help"></small></div>
    <div id="domain-matching-options"><div class="field-row"><div class="field"><label for="rule-path-match-type" data-i18n="pathCondition"></label><select id="rule-path-match-type"><option value="prefix" data-i18n="pathPrefix"></option><option value="exact" data-i18n="pathExact"></option></select></div><div class="field"><label for="rule-path-pattern" data-i18n="pathOptional"></label><input class="input" id="rule-path-pattern" placeholder="/search"></div></div><div class="field"><label for="rule-query-key" data-i18n="queryKeyOptional"></label><input class="input" id="rule-query-key" data-i18n-placeholder="queryKeyPlaceholder"><small data-i18n="queryKeyHelp"></small></div></div>
    <div id="normalize-options"><div class="field"><label for="normalize-mode" data-i18n="normalizeResult"></label><select id="normalize-mode"><option value="" disabled data-i18n="normalizeModeRequired"></option><option value="keepOriginOnly" data-i18n="keepOriginOnly"></option><option value="keepOriginAndPath" data-i18n="keepOriginAndPath"></option><option value="stripAll" data-i18n="stripAll"></option><option value="stripSelectedQuery" data-i18n="stripSelectedQuery"></option><option value="keepSelectedQuery" data-i18n="keepSelectedQuery"></option><option value="customFixed" data-i18n="customFixed"></option></select><small id="normalize-help"></small></div><div class="field" id="strip-query-container" hidden><label for="strip-query-keys" data-i18n="stripKeysLabel"></label><input class="input" id="strip-query-keys" data-i18n-placeholder="stripKeysPlaceholder"></div><div class="field" id="selected-query-container" hidden><label for="keep-query-keys" data-i18n="keepKeysLabel"></label><input class="input" id="keep-query-keys" data-i18n-placeholder="keepKeysPlaceholder"></div><div class="field" id="custom-fixed-container" hidden><label for="custom-fixed-url" data-i18n="fixedUrlLabel"></label><input class="input" id="custom-fixed-url" type="url" placeholder="https://example.com/"></div></div>
    <details class="advance"><summary data-i18n="advancedSettings"></summary><label class="switch"><input type="checkbox" id="rule-enabled" checked><span aria-hidden="true"></span><span data-i18n="enableRule"></span></label></details><div class="error" id="form-error" role="alert"></div>
  </div><div class="modal-footer"><button class="btn" type="button" id="cancel-btn" data-i18n="cancel"></button><button class="btn primary" type="submit" id="save-rule-btn" data-i18n="saveRule"></button></div></form></div></div>
<div class="modal-back" id="delete-modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-title" style="max-width:430px"><div class="modal-header"><div><h2 id="delete-title" data-i18n="deleteConfirmTitle"></h2><p data-i18n="deleteConfirmBody"></p></div></div><div class="modal-footer"><button class="btn" type="button" id="delete-cancel-btn" data-i18n="cancel"></button><button class="btn danger" type="button" id="delete-confirm-btn" data-i18n="deleteRule"></button></div></div></div>
<div class="modal-back" id="template-modal" hidden><div class="modal template-modal" role="dialog" aria-modal="true" aria-labelledby="template-title"><div class="modal-header"><div><h2 id="template-title" data-i18n="templateTitle"></h2><p data-i18n="templateIntro"></p><p class="status-good" id="template-status" role="status"></p><p class="error" id="template-error" role="alert"></p></div><button class="btn icon" type="button" id="close-templates-btn" data-i18n-aria-label="closeDialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div><div class="modal-body"><p class="template-note" data-i18n="templateOrderNote"></p><div class="template-list" id="template-list"></div></div><div class="modal-footer"><button class="btn" type="button" id="cancel-templates-btn" data-i18n="closeTemplates"></button></div></div></div>
<div class="modal-back" id="import-modal" hidden><div class="modal import-modal" role="dialog" aria-modal="true" aria-labelledby="import-title"><div class="modal-header"><div><h2 id="import-title" data-i18n="importTitle"></h2><p id="import-summary"></p><p id="import-invalid" hidden></p></div><button class="btn icon" type="button" id="close-import-btn" data-i18n-aria-label="closeDialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div><div class="modal-body"><fieldset class="import-modes"><legend data-i18n="importModeLegend"></legend><label class="import-mode"><input type="radio" name="import-mode" value="append" checked><span><strong data-i18n="importAppend"></strong><small data-i18n="importAppendHelp"></small></span></label><label class="import-mode"><input type="radio" name="import-mode" value="replace"><span><strong data-i18n="importReplace"></strong><small id="import-replace-help"></small></span></label></fieldset><p class="error" id="import-error" role="alert"></p></div><div class="modal-footer"><button class="btn" type="button" id="import-cancel-btn" data-i18n="cancel"></button><button class="btn primary" type="button" id="import-confirm-btn" data-i18n="importConfirm"></button></div></div></div>
<script type="module" src="options.js"></script>
</body>
</html>
