name: Check extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm test
      - run: python3 -m unittest tests.test_build_package
      - run: python3 release/build_package.py --browser all
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.60.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 release/build_package.py --browser chrome --output /tmp/historyfilter-chrome.zip
      - run: python3 -m zipfile -e /tmp/historyfilter-chrome.zip /tmp/historyfilter-chrome
      - run: python3 tests/browser_release.py --extension-dir /tmp/historyfilter-chrome
      - run: python3 tests/browser_reliability.py --browser chrome --extension /tmp/historyfilter-chrome
      - run: python3 tests/browser_templates.py --browser chrome --extension /tmp/historyfilter-chrome
